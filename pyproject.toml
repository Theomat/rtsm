[tool.poetry]
name = "rtsm"
version = "0.1.0"
description = "Ranked Test Suite minimisation"
authors = ["Théo Matricon <theomatricon@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Theomat/rtsm"

[tool.poetry.dependencies]
python = ">=3.8"
numpy = ">=1.22"
scikit-learn = ">=1.0"
colorama = ">=0.4.4"
tqdm = ">=4.63.0"

[tool.poetry.group.dev.dependencies]
ruff = "*"
pygad = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"